name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The release notes are the message of the annotated tag (see docs/development/RELEASE.md).
      # actions/checkout fetches the tag of a tag push as a lightweight one, which would make
      # --notes-from-tag fall back to the commit message, so the tag object is fetched again and a
      # tag without a message fails the release, before the build, instead of publishing the wrong
      # notes.
      - name: Fetch the annotated tag
        run: |
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]; then
            echo "::error::$GITHUB_REF_NAME is not an annotated tag; its message is the release notes"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      # The tag (minus the leading "v") overrides pluginVersion from gradle.properties, so the
      # zip name and plugin.xml version always match the released tag.
      - name: Build plugin
        run: ./gradlew buildPlugin -PpluginVersion="${GITHUB_REF_NAME#v}"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/distributions/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes-from-tag
